  <script>
    (() => {
      const form = document.querySelector('form');
      const login = document.querySelector('#login');
      const input = document.querySelector('#password');
      const button = form.querySelector('button');
      const status = document.querySelector('#status');
      const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (button.disabled) return;
        if (!window.crypto?.subtle || !window.DecompressionStream) {
          status.textContent = '请使用新版浏览器，通过 HTTPS 站点或本机文件打开此页。';
          return;
        }
        button.disabled = true;
        status.textContent = '正在解锁…';
        try {
          const payload = JSON.parse(document.querySelector('#encrypted').textContent);
          const credentials = new TextEncoder().encode(JSON.stringify([login.value, input.value]));
          const material = await crypto.subtle.importKey('raw', credentials, 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt: decode(payload.salt), iterations: payload.iterations },
            material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
          );
          const compressed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.ciphertext));
          const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
          const html = await new Response(stream).text();
          input.value = '';
          document.open();
          document.write(html);
          document.close();
        } catch {
          status.textContent = '解锁失败，请核对登录名和密码后重试。';
          button.disabled = false;
          input.select();
        }
      });
    })();
  </script>
