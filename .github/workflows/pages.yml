name: Publish Euphonium
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: euphonium-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'site-content-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Assemble the site with the latest encrypted release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --limit 100 --exclude-drafts --json tagName --jq '[.[] | select(.tagName | startswith("site-content-"))][0].tagName')
          test -n "$tag"
          gh release download "$tag" --pattern encrypted-site.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p _site/studio
          cp index.html _site/
          cp -R esg _site/esg
          cp studio/index.html studio/login.js studio/sw.js _site/studio/
          cp studio/index.html _site/studio/shell.html
          cp studio/index.html _site/404.html
          tar -xzf "$RUNNER_TEMP/encrypted-site.tar.gz" -C _site/studio
          test -s _site/studio/manifest.bin
          test -s _site/studio/meta.json
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_ID was not visible in run $GITHUB_RUN_ID"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
